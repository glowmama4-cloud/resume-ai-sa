<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers — Jobs | ResumeAI SA</title>
<meta name="description" content="Jobs from around the world, remote and in-office. Apply directly with the CV you built on ResumeAI SA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sa-green:   #007A4D;
    --sa-green-d: #005C39;
    --sa-gold:    #D4A017;
    --sa-red:     #C0392B;
    --ink:        #16161a;
    --ink2:       #4a4a6a;
    --ink3:       #9090aa;
    --surf:       #ffffff;
    --surf2:      #f7f6f2;
    --surf3:      #f0ede6;
    --border:     #e2dfd8;
    --border2:    #ccc9c0;
    --green-bg:   #e8f5ee;
    --green-txt:  #005C39;
    --blue-bg:    #eff6ff;
    --blue-txt:   #1e40af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Sora', sans-serif;
    background: var(--surf2);
    color: var(--ink);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sa-green-d);
    background: var(--green-bg);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--ink2);
    margin: 0 0 20px;
    font-size: 15px;
  }
  .search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border2);
    background: var(--surf);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    margin-bottom: 14px;
  }
  .search:focus {
    border-color: var(--sa-green);
  }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .tab {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border2);
    background: var(--surf);
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab:hover { border-color: var(--sa-green); color: var(--ink); }
  .tab.active {
    background: var(--sa-green);
    border-color: var(--sa-green);
    color: #fff;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filter-row select {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surf);
    color: var(--ink2);
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surf);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.15s ease;
  }
  .card:hover {
    border-color: var(--sa-green);
  }
  .logo {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--surf3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--ink3);
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .title {
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .company {
    color: var(--ink2);
    font-size: 13px;
    margin: 0 0 8px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-size: 11px;
    background: var(--surf3);
    color: var(--ink2);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .tag.salary {
    background: var(--green-bg);
    color: var(--green-txt);
  }
  .tag.category {
    background: var(--blue-bg);
    color: var(--blue-txt);
  }
  .apply {
    flex-shrink: 0;
    background: var(--sa-green);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .apply:hover {
    background: var(--sa-green-d);
  }
  .empty, .loading {
    color: var(--ink3);
    font-size: 14px;
    padding: 24px 4px;
    text-align: center;
  }
  .load-more-row {
    text-align: center;
    margin-top: 18px;
  }
  .load-more {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 10px;
    border: 1.5px solid var(--border2);
    background: var(--surf);
    color: var(--ink);
    cursor: pointer;
  }
  .load-more:hover { border-color: var(--sa-green); }
  .load-more:disabled { opacity: 0.5; cursor: default; }
  .result-count {
    font-size: 12px;
    color: var(--ink3);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <span class="eyebrow">Careers</span>
  <h1>Find your next role</h1>
  <p class="sub">Jobs from around the world — remote and in-office — apply straight to the employer.</p>

  <input type="text" id="search" class="search" placeholder="Search job title or company">

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">All Jobs</button>
    <button class="tab" data-tab="remote">Remote</button>
    <button class="tab" data-tab="south_africa">South Africa</button>
    <button class="tab" data-tab="international">International</button>
  </div>

  <div class="filter-row">
    <select id="jobCategory">
      <option value="">Any job type</option>
      <option value="internship">Internships</option>
      <option value="learnership">Learnerships</option>
      <option value="graduate_programme">Graduate Programmes</option>
    </select>
    <select id="employmentType">
      <option value="all">Any employment type</option>
      <option value="full_time" selected>Full-time</option>
      <option value="part_time">Part-time</option>
      <option value="contract">Contract</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>

  <div class="list" id="jobList">
    <div class="loading">Loading jobs…</div>
  </div>

  <div class="load-more-row" id="loadMoreRow" style="display:none;">
    <button class="load-more" id="loadMoreBtn">Load more jobs</button>
  </div>
</div>

<script>
  const jobListEl      = document.getElementById('jobList');
  const searchEl       = document.getElementById('search');
  const tabsEl         = document.getElementById('tabs');
  const jobCategoryEl  = document.getElementById('jobCategory');
  const employmentEl   = document.getElementById('employmentType');
  const resultCountEl  = document.getElementById('resultCount');
  const loadMoreRow    = document.getElementById('loadMoreRow');
  const loadMoreBtn    = document.getElementById('loadMoreBtn');

  let activeTab   = 'all';
  let currentPage = 1;
  let allJobs     = [];
  let totalCount  = 0;
  let debounceTimer;

  const REMOTE_SCOPE_LABELS = {
    worldwide: 'Remote · Worldwide',
    south_africa: 'Remote · South Africa',
    country_restricted: 'Remote · Country-restricted',
    region_restricted: 'Remote · Region-restricted',
    hybrid: 'Hybrid',
    onsite: 'On-site',
    unknown: '',
  };

  const CATEGORY_LABELS = {
    internship: 'Internship',
    learnership: 'Learnership',
    graduate_programme: 'Graduate Programme',
  };

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 30) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderJobs(jobs, append) {
    if (!jobs || jobs.length === 0) {
      if (!append) {
        jobListEl.innerHTML = '<div class="empty">No jobs match right now — try a different filter or check back soon.</div>';
      }
      return;
    }
    const html = jobs.map(function (job) {
      const initial = (job.company_name || '?').charAt(0).toUpperCase();
      const logo = job.company_logo_url
        ? '<img src="' + escapeHtml(job.company_logo_url) + '" alt="">'
        : initial;
      const salaryTag = job.salary_text
        ? '<span class="tag salary">' + escapeHtml(job.salary_text) + '</span>'
        : '';
      const remoteLabel = REMOTE_SCOPE_LABELS[job.remote_scope] || '';
      const remoteTag = remoteLabel
        ? '<span class="tag">' + escapeHtml(remoteLabel) + '</span>'
        : '';
      const categoryLabel = CATEGORY_LABELS[job.job_category];
      const categoryTag = categoryLabel
        ? '<span class="tag category">' + escapeHtml(categoryLabel) + '</span>'
        : '';
      return (
        '<div class="card">' +
          '<div class="logo">' + logo + '</div>' +
          '<div class="info">' +
            '<p class="title">' + escapeHtml(job.title) + '</p>' +
            '<p class="company">' + escapeHtml(job.company_name) + '</p>' +
            '<div class="tags">' +
              '<span class="tag">' + escapeHtml(job.location || 'Worldwide') + '</span>' +
              remoteTag +
              categoryTag +
              salaryTag +
              '<span class="tag">' + timeAgo(job.posted_at) + '</span>' +
            '</div>' +
          '</div>' +
          '<a class="apply" href="' + escapeHtml(job.apply_url) + '" target="_blank" rel="noopener noreferrer">Apply</a>' +
        '</div>'
      );
    }).join('');

    if (append) {
      jobListEl.insertAdjacentHTML('beforeend', html);
    } else {
      jobListEl.innerHTML = html;
    }
  }

  function buildParams(page) {
    const params = new URLSearchParams();
    const search = searchEl.value.trim();
    if (search) params.set('search', search);
    params.set('page', String(page));
    params.set('employment_type', employmentEl.value);

    const jobCategory = jobCategoryEl.value;
    if (jobCategory) params.set('job_category', jobCategory);

    // Tabs map to real, existing columns populated by jobs-sync.js — never
    // a category with no matching data.
    if (activeTab === 'remote') {
      params.set('is_remote', 'true');
    } else if (activeTab === 'south_africa') {
      params.set('country', 'ZA');
    } else if (activeTab === 'international') {
      params.set('exclude_country', 'ZA');
    }

    return params;
  }

  function loadJobs(page, append) {
    if (!append) {
      jobListEl.innerHTML = '<div class="loading">Loading jobs…</div>';
      resultCountEl.textContent = '';
      loadMoreRow.style.display = 'none';
    } else {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Loading…';
    }

    const params = buildParams(page);

    fetch('/api/jobs?' + params.toString())
      .then(function (res) { return res.json(); })
      .then(function (data) {
        currentPage = page;
        totalCount = data.total || 0;
        renderJobs(data.jobs, append);

        const shown = Math.min(page * 20, totalCount);
        resultCountEl.textContent = totalCount > 0
          ? shown + ' of ' + totalCount + ' jobs'
          : '';

        if (totalCount > page * 20) {
          loadMoreRow.style.display = 'block';
          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = 'Load more jobs';
        } else {
          loadMoreRow.style.display = 'none';
        }
      })
      .catch(function () {
        if (!append) {
          jobListEl.innerHTML = '<div class="empty">Couldn\'t load jobs right now — try refreshing.</div>';
        }
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load more jobs';
      });
  }

  function refresh() {
    loadJobs(1, false);
  }

  searchEl.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(refresh, 300);
  });

  jobCategoryEl.addEventListener('change', refresh);
  employmentEl.addEventListener('change', refresh);

  tabsEl.addEventListener('click', function (e) {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    tabsEl.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    refresh();
  });

  loadMoreBtn.addEventListener('click', function () {
    loadJobs(currentPage + 1, true);
  });

  refresh();
</script>

</body>
</html>
